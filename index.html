---
layout: default
title: Home
---
<ul class="post-list">
  {% for post in site.posts %}
  <li class="post-list-item">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</p>
    <p>{{ post.excerpt | strip_html | truncate: 200 }}</p>
  </li>
  {% endfor %}
</ul>
