---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-share">
    <span class="post-share-label">Share this:</span>
    <a class="post-share-link" href="mailto:?subject={{ page.title | url_encode }}&body={{ page.url | absolute_url | url_encode }}">Email</a>
    <button type="button" class="post-share-link post-share-copy" data-url="{{ page.url | absolute_url }}">Copy link</button>
  </div>
</article>
