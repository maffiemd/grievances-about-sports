<form class="subscribe-form" id="subscribe-form">
  <label for="subscribe-email" class="visually-hidden">Email address</label>
  <input type="email" id="subscribe-email" name="email" placeholder="you@example.com" required>
  <button type="submit">Subscribe</button>
  <p class="subscribe-status" id="subscribe-status" role="status"></p>
</form>
