<footer class="site-footer">
  <div class="wrap">
    {% unless page.url == '/subscribe/' %}
    <div class="footer-subscribe">
      <h2>Get new grievances by email</h2>
      {% include subscribe-form.html %}
    </div>
    {% endunless %}
    <p class="footer-meta">
      &copy; {{ site.time | date: '%Y' }} {{ site.title }}. ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
      <a href="{{ '/unsubscribe/' | relative_url }}">Unsubscribe</a>
    </p>
  </div>

  <script>
    window.SUPABASE_URL = {{ site.supabase_url | jsonify }};
    window.SUPABASE_ANON_KEY = {{ site.supabase_anon_key | jsonify }};
  </script>
  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/supabase.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/supabase-client.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/subscribe.js' | relative_url }}"></script>
  {% if page.url == '/unsubscribe/' %}
  <script src="{{ '/assets/js/unsubscribe.js' | relative_url }}"></script>
  {% endif %}
  {% if page.layout == 'post' %}
  <script src="{{ '/assets/js/share.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/comments.js' | relative_url }}"></script>
  {% endif %}
</footer>
